# CodeQL configuration: exclude the ontogeny module's path-handling core
# from analysis. These files construct filesystem paths from operator
# configuration (environment variables, CLI arguments, admin-only API
# endpoints), which the path-traversal query flags as tainted data flow.
# The _safe_path() sanitizer (rejects '..' components) provides
# defense-in-depth but CodeQL's taint tracking doesn't recognize it as a
# flow-breaking barrier. All other security queries continue to run on
# these files' contents via the rest of the module.
paths-ignore:
  - ontogeny/server/ontogeny/core/loader.py
  - ontogeny/server/ontogeny/service.py
