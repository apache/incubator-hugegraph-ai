# CodeQL configuration: loads a model pack that marks _safe_path() as a
# barrier for path-injection. Unlike paths-ignore, this does NOT exclude
# any file from scanning — every file is fully analyzed by every query;
# the model only tells the path-traversal data flow that values returned
# by _safe_path() are sanitized (os.path.realpath + '..' rejection).
packs:
  - uses: ./.github/codeql
