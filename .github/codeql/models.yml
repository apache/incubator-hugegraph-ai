# CodeQL data extension: mark _safe_path() as a barrier for path-injection.
#
# _safe_path() (in both ontogeny.core.loader and ontogeny.service) calls
# os.path.realpath() and rejects any '..' components in the resolved result,
# making its return value safe for filesystem access. CodeQL's taint tracking
# doesn't automatically recognize custom sanitizers, so this model tells the
# py/unsafe-path-traversal query that data flowing through _safe_path().ReturnValue
# is clean for path-injection.
#
# This is the narrowest possible suppression: one function, one vulnerability
# kind. Every file continues to be scanned by every other query.
extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: barrierModel
    data:
      - ["ontogeny.core.loader", "Member[_safe_path].ReturnValue", "path-injection"]
      - ["ontogeny.service", "Member[_safe_path].ReturnValue", "path-injection"]
